name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Files the page needs exist
        run: |
          set -e
          test -f index.html
          test -f assets/app.js
          test -f assets/styles.css
          grep -q 'assets/app.js' index.html
          grep -q 'assets/styles.css' index.html
      - name: app.js parses
        run: node --check assets/app.js
      - name: No leftover markers
        run: '! grep -rn "TODO(author)" --include="*.html" --include="*.js" --include="*.css" .'

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set - skipping deploy"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy . --project-name rag-pipeline-mobile --branch "${GITHUB_REF_NAME}"
